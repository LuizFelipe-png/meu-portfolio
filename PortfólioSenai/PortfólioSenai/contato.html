<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="curriculo.html">Meu currículo</a></li>
                <li><a href="contato.html">Entre em contato</a></li>
                <li><a href="index.html">Volte para o início</a></li>
            </ul>

            <h2><strong>Desenvolvedor web front-end em formação</strong></h2>
        </nav>
    </header>
    <main>
        <section>
            <h2>Fale comigo</h2>

            <form action="#" method="POST">

                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" minlength="3" required>
                <button type="submit">Enviar</button>
                <br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
                <button type="submit">Enviar</button>
                <br>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" required>
                <button type="submit">Enviar</button>
                <br>

                <label for="dataNascimento">Data de Nascimento:</label>
                <input type="date" id="dataNascimento" name="dataNascimento" required>
                <button type="submit">Enviar</button>
                <br></br>

                <fieldset>
                    <legend>Dados Pessoais:</legend>

                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" required>
                    <button type="submit">Enviar</button>
                    <br>

                    <label for="rua">Rua:</label>
                    <input type="text" id="rua" name="rua" required>
                    <button type="submit">Enviar</button>
                    <br>

                    <label for="numero">Número:</label>
                    <input type="number" id="numero" name="numero" minlength="1" maxlength="99999">
                    <button type="submit">Enviar</button>
                    <br>

                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required>
                    <button type="submit">Enviar</button>
                    <br>

                    <label for="estado">Estado:</label>
                    <select id="estado" name="estado" >
                        <option value="">Selecione seu estado:</option>
                        <option value="rondonia">Rondônia</option>
                        <option value="parana">Paraná</option>
                        <option value="sao-paulo">São Paulo</option>
                        <option value="amazonas">Amazonas</option>
                        <option value="santa-catarina">Santa Catarina</option>
                    </select>
                </fieldset>

                <br></br>

                <fieldset>
                    <legend>Interesse</legend>

                    <select id="areaInteresse" name="areaInteresse">
                        <option value="">Selecione sua área:</option>
                        <option value="back-end">Back-End</option>
                        <option value="front-end">Front-End</option>
                        <option value="banco-de-dados">Banco de Dados</option>
                        <option value="full-stack">Full-Stack</option>
                    </select>

                    <br></br>

                    <legend>Nível de Experiência:</legend>
                    <input type="radio" id="iniciante" name="nivel" value="iniciante" required>
                    <label for="iniciante">Iniciante</label>
                    <br>

                    <input type="radio" id="intermediario" name="nivel" value="intermediario" required>
                    <label for="intermediario">Intermediário</label>
                    <br>

                    <input type="radio" id="avancado" name="nivel" value="avancado" required>
                    <label for="avancado">Avançado</label>

                    <br></br>
                    <textarea id="mensagem" name="mensagem" rows="5" cols="20" maxlength="500">
                    Escreva a mensagem aqui.
                    </textarea>

                    <br>
                    <input type="checkbox" id="termos" name="termos" value="termos" required>
                    <label for="termos">Li e aceito os termos de uso.</label><br></br>

                    <button type="submit">Enviar</button>
                </fieldset>

            </form>
        </section>
    </main>

    <footer>
        © 2026 Luiz Felipe Costa Silva Murarolli
        <a href="mailto:luizfelipemurarolli@gmail.com">Meu Email</a>
    </footer>
</body>

</html>
