<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Movimente-se</title>
</head>
<body>
    <h1>Bem-vindo a Academia Movimenta-se</h1>
    <h2>Escolha o Plano:</h2>
        <input type="radio" id="mensal" name="mensal" value="mensal" required>
        <label for="mensal">Mensal</label>
        <br>

        <input type="radio" id="trimestral" name="trimestral" value="trimestral" required>
        <label for="trimestral">Trimestral</label>
        <br>

        <input type="radio" id="anual" name="anual" value="anual" required>
        <label for="anual">Anual</label>
        <br>

        <h2>Modalidades:</h2>
        <input type="checkbox" id="musculacao" name="musculacao" value="musculacao" required>
            <label for="musculacao">Musculação</label>
        <br>

        <input type="checkbox" id="pilates" name="pilates" value="pilates" required>
            <label for="pilates">Pilates</label><br>

        <input type="checkbox" id="spinning" name="spinning" value="spinning" required>
            <label for="spinning">Spinning</label>
        <br>

        <input type="checkbox" id="natacao" name="natacao" value="natacao" required>
            <label for="natacao">Natação</label>
        <br>


</body>
</html>
